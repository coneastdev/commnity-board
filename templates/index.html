<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Board</title>
    <link href="{{ url_for('static', path='/styles.css').path }}" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>
<body>
    <nav class="navbar md:navbar-expand bg-1" data-bs-theme="light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Community noticeboard</a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer" aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
            <div class="drawer-header">
                <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
                <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
            </div>
            <div class="drawer-body mb-2 md:mb-0">
                <ul class="nav navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/create">Create</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/manage">Manage</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/settings">Settings</a>
                </li>
                </ul>
            </div>
            </dialog>
        </div>
    </nav>
    <br />
    <div id="content">
        <div id="featured" class="posts">
            <div id="carouselStackedIndicators" class="carousel slide">
                <div class="d-flex justify-content-between align-items-center">
                    <h2>Featured posts</h2>
                    <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselStackedIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselStackedIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carouselStackedIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
                    </div>
                    <div>
                    <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselStackedIndicators" data-bs-slide="prev">
                        <span class="carousel-icon-prev" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselStackedIndicators" data-bs-slide="next">
                        <span class="carousel-icon-next" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                    </div>
                </div>
                <div class="carousel-inner rounded-5">
                    <div class="carousel-item active">
                    <img src="https://placehold.co/1024x512" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                    <img src="https://placehold.co/1024x512" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                    <img src="https://placehold.co/1024x512" class="d-block w-100" alt="...">
                    </div>
                </div>
            </div>
        </div>
        <br />
        <div id="new" class="posts">
            <div id="carouselMultiple" class="carousel slide" data-bs-ends="stop" style="--bs-carousel-items: 3; --bs-carousel-items-gap: 1rem;">
                <div class="d-flex justify-content-between align-items-center">
                    <h2 class="mb-0">New posts</h2>
                    <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselMultiple" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselMultiple" data-bs-slide-to="1" aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carouselMultiple" data-bs-slide-to="2" aria-label="Slide 3"></button>
                    <button type="button" data-bs-target="#carouselMultiple" data-bs-slide-to="3" aria-label="Slide 4"></button>
                    <button type="button" data-bs-target="#carouselMultiple" data-bs-slide-to="4" aria-label="Slide 5"></button>
                    </div>
                    <div>
                    <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselMultiple" data-bs-slide="prev" style="--bs-carousel-control-icon-width: 1rem;">
                        <span class="carousel-icon-prev" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselMultiple" data-bs-slide="next" style="--bs-carousel-control-icon-width: 1rem;">
                        <span class="carousel-icon-next" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                    </div>
                </div>
                <div class="carousel-inner">
                    <div class="carousel-item"><img src="https://placehold.co/512x512" class="d-block w-100 rounded-5" alt="..."></div>
                    <div class="carousel-item"><img src="https://placehold.co/512x512" class="d-block w-100 rounded-5" alt="..."></div>
                    <div class="carousel-item"><img src="https://placehold.co/512x512" class="d-block w-100 rounded-5" alt="..."></div>
                    <div class="carousel-item"><img src="https://placehold.co/512x512" class="d-block w-100 rounded-5" alt="..."></div>
                    <div class="carousel-item"><img src="https://placehold.co/512x512" class="d-block w-100 rounded-5" alt="..."></div>
                    <div class="carousel-item"><img src="https://placehold.co/512x512" class="d-block w-100 rounded-5" alt="..."></div>
                    <div class="carousel-item"><img src="https://placehold.co/512x512" class="d-block w-100 rounded-5" alt="..."></div>
                </div>
            </div>
        </div>
        <br />
        <div id="allContent" class="posts">
            <h2>All Posts - Page {{pageNum}}/{{totalPages}}</h2>
            
            <div class="container text-center overflow-hidden">
            <div class="row row-cols-2 lg:row-cols-4 g-2 lg:g-3">
                <div class="col">
                    <div class="carousel-item"><img src="https://placehold.co/512x512" class="d-block w-100 rounded-5" alt="..."></div>
                    <div class="carousel-item"><img src="https://placehold.co/512x512" class="d-block w-100 rounded-5" alt="..."></div>
                </div>
                <div class="col">
                    <div class="carousel-item"><img src="https://placehold.co/512x512" class="d-block w-100 rounded-5" alt="..."></div>
                    <div class="carousel-item"><img src="https://placehold.co/512x512" class="d-block w-100 rounded-5" alt="..."></div>
                </div>
                <div class="col">
                    <div class="carousel-item"><img src="https://placehold.co/512x512" class="d-block w-100 rounded-5" alt="..."></div>
                    <div class="carousel-item"><img src="https://placehold.co/512x512" class="d-block w-100 rounded-5" alt="..."></div>
                </div>
                <div class="col">
                    <div class="carousel-item"><img src="https://placehold.co/512x512" class="d-block w-100 rounded-5" alt="..."></div>
                    <div class="carousel-item"><img src="https://placehold.co/512x512" class="d-block w-100 rounded-5" alt="..."></div>
                </div>
            </div>
            </div>

            <br />

            <nav aria-label="posts page control" data-bs-theme="light">
            <ul class="pagination justify-content-center">
                <li class="page-item"><a href="#" class="page-link"><span aria-hidden="true">&laquo;</span></a></li>
                <li class="page-item active"><a class="page-link" href="#">1</a></li>
                <li class="page-item">
                <a class="page-link" href="#" aria-current="page">2</a>
                </li>
                <li class="page-item"><a class="page-link" href="#">3</a></li>
                <li class="page-item"><a class="page-link" href="#"><span aria-hidden="true">&raquo;</span></a></li>
            </ul>
            </nav>
        </div>
    </div>
</body>
</html>
