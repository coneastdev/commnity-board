<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Board</title>
    <link href="{{ url_for('static', path='/styles.css').path }}" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>
<body>
    <nav class="navbar md:navbar-expand bg-1" data-bs-theme="light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Community noticeboard</a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer" aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
            <div class="drawer-header">
                <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
                <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
            </div>
            <div class="drawer-body mb-2 md:mb-0">
                <ul class="nav navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/create">Create</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/manage">Manage</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/settings">Settings</a>
                </li>
                </ul>
            </div>
            </dialog>
        </div>
    </nav>
    <br />
    <div id="logingDiv">
        <div class="container" style="background-color: #f6f7f8; border-radius: 15px; width: 35%; padding: 2vw;" data-bs-theme="light">
            <div class="form-field">
            <label for="fieldText" class="form-label">Email address</label>
            <input type="email" class="form-control" id="fieldText" placeholder="name@example.com">
            </div>
            <br />
            <div class="form-field">
            <label for="password1" class="form-label">Password</label>
            <input type="password" class="form-control" id="password1" placeholder="Enter password">
            <div class="strength" data-bs-strength>
                <div class="strength-segment"></div>
                <div class="strength-segment"></div>
                <div class="strength-segment"></div>
                <div class="strength-segment"></div>
            </div>
            </div>
            <br />
            <div class="form-field">
            <label class="form-label">Terms and conditions</label>
            <input type="checkbox" id="fieldOverheadCheck" class="check" disabled checked="true" />
            <div class="form-field-content">
                <label for="fieldOverheadCheck">I agree to the terms and conditions</label>
            </div>
            </div>
            <br />
            <div role="group" style="text-align: center;" aria-label="Form submit butons">
                <button type="submit" class="theme-primary btn-solid btn-lg">
                    Login
                </button><br />
                <button type="submit" class="theme-inverse btn-text btn-sm">
                    Sign Up
                </button>
            </div>
        </div> 
    </div>
</body>
</html>
